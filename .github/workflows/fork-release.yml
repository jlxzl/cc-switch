name: Fork Release (Windows)

# 手动触发或推送 v*-z* 标签时，构建 Windows x64 安装包并发 GitHub Release。
# 安装包用仓库自己的签名密钥签名，旧版 Z 应用通过 latest.json 自动更新。
on:
  push:
    tags:
      - 'v*-z*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Prepare release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Recurse -Include *-setup.exe |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'No NSIS installer found' }
          $installerName = "CC-Switch-ZL-$env:VERSION-Windows-Setup.exe"
          Copy-Item $installer.FullName (Join-Path release-assets $installerName)

          $sig = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Recurse -Include *-setup.exe.sig |
            Select-Object -First 1
          if ($null -eq $sig) { throw 'No updater signature found' }
          Copy-Item $sig.FullName (Join-Path release-assets "$installerName.sig")

          $exe = 'src-tauri/target/release/cc-switch.exe'
          if (-not (Test-Path $exe)) { throw 'No cc-switch.exe found' }
          $zipName = "CC-Switch-ZL-$env:VERSION-Windows-Portable.zip"
          Compress-Archive -Path $exe -DestinationPath (Join-Path release-assets $zipName) -Force

          Get-ChildItem release-assets | Select-Object Name, Length

      - name: Prepare release body
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notesPath = "docs/release-notes/zl/v$env:VERSION.md"
          if (Test-Path $notesPath) {
            $body = [System.IO.File]::ReadAllText(
              (Resolve-Path $notesPath),
              [System.Text.Encoding]::UTF8
            )
            $body = [regex]::Replace($body, '(?s)<!--\s*summary:.*?-->', '').Trim()
            $body = [regex]::Replace($body, '(\r?\n){3,}', "`n`n")
          } else {
            $lines = @(
              "## CC Switch ZL $env:VERSION",
              "",
              "Windows x64 非官方定制构建。",
              "",
              "官方仓库：https://github.com/farion1231/cc-switch",
              "",
              "- ``CC-Switch-ZL-$env:VERSION-Windows-Setup.exe``：安装版",
              "- ``CC-Switch-ZL-$env:VERSION-Windows-Portable.zip``：便携版，解压即用",
              "",
              "> 安装包未做 Windows 代码签名，SmartScreen 可能提示；更新包本身已用本仓库密钥签名。"
            )
            $body = $lines -join "`n"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'release-notes.md'),
            $body,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Generate latest.json
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Path release-assets -Filter '*-Windows-Setup.exe' |
            Select-Object -First 1
          $sig = Get-ChildItem -Path release-assets -Filter '*-Windows-Setup.exe.sig' |
            Select-Object -First 1
          if ($null -eq $setup -or $null -eq $sig) { throw 'Missing NSIS installer or signature' }
          $tag = "v$env:VERSION"
          $notesPath = "docs/release-notes/zl/v$env:VERSION.md"
          $summary = "CC Switch ZL $env:VERSION"
          if (Test-Path $notesPath) {
            $notesText = [System.IO.File]::ReadAllText(
              (Resolve-Path $notesPath),
              [System.Text.Encoding]::UTF8
            )
            $match = [regex]::Match($notesText, '(?s)<!--\s*summary:\s*(.*?)\s*-->')
            if ($match.Success) { $summary = $match.Groups[1].Value.Trim() }
          }
          $manifest = [ordered]@{
            version = $env:VERSION
            notes = $summary
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/jlxzl/cc-switch/releases/download/$tag/$($setup.Name)"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'release-assets/latest.json'),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          Get-Content release-assets/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CC Switch ZL ${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
